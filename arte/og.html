<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box}
 body{width:1200px;height:630px;background:#070707;color:#F5F5F3;font-family:Montserrat,sans-serif;
   display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
 .geo{position:absolute;inset:0;opacity:.10;
   background-image:linear-gradient(45deg,transparent 47%,#D4AF37 48%,#D4AF37 52%,transparent 53%),
                    linear-gradient(-45deg,transparent 47%,#D4AF37 48%,#D4AF37 52%,transparent 53%);
   background-size:80px 80px}
 .luz{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 0%,rgba(243,224,162,.22),transparent 70%)}
 .sky{position:absolute;left:0;right:0;bottom:0;height:300px;opacity:.5;
   -webkit-mask-image:linear-gradient(180deg,transparent,#000 45%)}
 .in{position:relative;text-align:center;padding-bottom:40px}
 svg.coroa{width:96px;height:96px;display:block;margin:0 auto 18px}
 h1{font-family:"Playfair Display",serif;font-size:74px;font-weight:600;letter-spacing:.01em}
 .tag{margin-top:14px;font-size:17px;letter-spacing:.34em;color:#D4AF37;font-weight:600}
 .sub{margin-top:26px;font-size:24px;color:#DCD6C8}
 .sub b{color:#F3E0A2;font-weight:600}
</style></head><body>
 <div class="geo"></div><div class="luz"></div>
 <img class="sky" src="skyline.svg">
 <div class="in">
  <svg class="coroa" viewBox="0 0 100 100">
   <g fill="none" stroke="#D4AF37" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 66 L14 34 L31 47 L50 24 L69 47 L86 34 L86 66 Z"/>
    <path d="M50 44 L61 56 L50 68 L39 56 Z" fill="#D4AF37"/><path d="M20 78 H80"/></g>
   <circle cx="14" cy="30" r="5" fill="#D4AF37"/><circle cx="50" cy="20" r="5" fill="#D4AF37"/><circle cx="86" cy="30" r="5" fill="#D4AF37"/>
  </svg>
  <h1>Yalla Experiences</h1>
  <div class="tag">TRAVEL. CONNECT. ASCEND.</div>
  <div class="sub">Experiências privativas e corporativas nos <b>Emirados Árabes Unidos</b></div>
 </div>
</body></html>
